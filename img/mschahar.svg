<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Floating Code / Tech Window Graphic -->
  <g transform="translate(500, 75)" filter="url(#drop-shadow)">
    <!-- Window Base -->
    <rect width="230" height="250" rx="14" fill="url(#card-surface)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="24" r="5" fill="#10b981" opacity="0.8"/>
    <line x1="0" y1="42" x2="230" y2="42" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Code Block Lines Mockup -->
    <rect x="24" y="60" width="75" height="7" rx="3.5" fill="#60a5fa" opacity="0.9"/>
    <rect x="105" y="60" width="45" height="7" rx="3.5" fill="#e2e8f0" opacity="0.4"/>
    
    <rect x="40" y="80" width="110" height="7" rx="3.5" fill="#a78bfa" opacity="0.8"/>
    <rect x="40" y="100" width="80" height="7" rx="3.5" fill="#34d399" opacity="0.8"/>
    <rect x="126" y="100" width="30" height="7" rx="3.5" fill="#e2e8f0" opacity="0.4"/>
    
    <rect x="40" y="120" width="60" height="7" rx="3.5" fill="#38bdf8" opacity="0.8"/>
    <rect x="24" y="140" width="35" height="7" rx="3.5" fill="#60a5fa" opacity="0.9"/>

    <!-- Floating Mini Badges Inside Graphic -->
    <rect x="24" y="180" width="70" height="24" rx="12" fill="#0284c7" opacity="0.3"/>
    <text x="59" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Flutter</text>

    <rect x="102" y="180" width="66" height="24" rx="12" fill="#7c3aed" opacity="0.3"/>
    <text x="135" y="196" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Kotlin</text>
  </g>

  <!-- Main Left-Aligned Portfolio Branding -->
  <!-- Monogram Logo Icon -->
  <g transform="translate(70, 75)">
    <rect width="56" height="56" rx="14" fill="#2563eb"/>
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">MC</text>
  </g>

  <!-- Name & Titles -->
  <text x="70" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Mahendra S Choudhary</text>
  <text x="70" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#60a5fa" letter-spacing="1">SOFTWARE DEVELOPER &amp; MOBILE CREATOR</text>

  <!-- Tagline -->
  <text x="70" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">Android • Flutter • Offline-First Tools • Open Source</text>

  <!-- Domain Badge -->
  <g transform="translate(70, 280)">
    <rect width="180" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Tiny Globe Icon -->
    <circle cx="22" cy="17" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="16" y1="17" x2="28" y2="17" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">mschahar.github.io</text>
  </g>
</svg>
