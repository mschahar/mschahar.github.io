<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="50%" stop-color="#0c1e40" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0056b3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0056b3" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrange" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ff7300" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff7300" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Gradients -->
    <linearGradient id="blueTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <linearGradient id="orangeTech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bgGrad)" />
  <rect width="800" height="400" fill="url(#glowBlue)" />
  <rect width="800" height="400" fill="url(#glowOrange)" />

  <!-- Subtle Background Grid/Circuit Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="800" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(60, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 72)">
      <rect width="180" height="28" rx="14" fill="#003d7a" fill-opacity="0.6" stroke="#0077ff" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#00d4ff" />
      <text x="26" y="18" fill="#a6d8ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">YOUR SMART MOBILE PARTNER</text>
    </g>

    <!-- App Title -->
    <g transform="translate(0, 155)">
      <text font-family="'Segoe UI', 'Montserrat', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5">
        <tspan fill="#00aaff">Mobi</tspan><tspan fill="#ff7a00">Sathi</tspan>
      </text>
      <!-- Title accent dot inside the 'o' concept -->
      <circle cx="95" cy="-28" r="4.5" fill="#00e1ff" />
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      Hardware Diagnostics &amp; Utility Suite
    </text>

    <!-- Feature Bullet Points -->
    <g transform="translate(0, 225)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8bb5e0">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="3" fill="#00aaff" />
        <text x="16" y="10">Component Testing (Sensor, Audio, Touch)</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="3" fill="#ff9900" />
        <text x="16" y="10">Real-Time Specs &amp; Battery Health Monitor</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="3" fill="#00e676" />
        <text x="16" y="10">Reliable &amp; Fast Troubleshooting</text>
      </g>
    </g>

    <!-- Verification / Store Badge -->
    <g transform="translate(0, 316)">
      <rect width="138" height="34" rx="8" fill="#102447" stroke="#0077ff" stroke-width="1.2" />
      <!-- Small Play Store Triangle Icon -->
      <path d="M 16 11 L 24 17 L 16 23 Z" fill="#00d4ff" />
      <text x="32" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">GET IT ON GOOGLE PLAY</text>
    </g>
  </g>

  <!-- Right Side: Graphic Emblem / Artwork Representation -->
  <g transform="translate(560, 190)" filter="url(#shadow)">
    <!-- Circuit Branches (Blue - Left) -->
    <g stroke="url(#blueTech)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -50, 10 L -90, 10 L -120, -30 L -150, -30" />
      <path d="M -50, 25 L -80, 25 L -105, 55 L -140, 55" />
      <path d="M -50, -10 L -80, -10 L -100, -70 L -130, -70" />
    </g>
    <!-- Circuit Terminals (Blue) -->
    <circle cx="-150" cy="-30" r="7" fill="#0c1e40" stroke="#0099ff" stroke-width="5" />
    <circle cx="-140" cy="55" r="7" fill="#0c1e40" stroke="#0099ff" stroke-width="5" />
    <circle cx="-130" cy="-70" r="7" fill="#0c1e40" stroke="#0099ff" stroke-width="5" />

    <!-- Circuit Branches (Orange - Right) -->
    <g stroke="url(#orangeTech)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 50, 10 L 90, 10 L 120, -30 L 150, -30" />
      <path d="M 50, 25 L 80, 25 L 105, 55 L 140, 55" />
      <path d="M 50, -10 L 80, -10 L 100, -70 L 130, -70" />
    </g>
    <!-- Circuit Terminals (Orange) -->
    <circle cx="150" cy="-30" r="7" fill="#0c1e40" stroke="#ff8800" stroke-width="5" />
    <circle cx="140" cy="55" r="7" fill="#0c1e40" stroke="#ff8800" stroke-width="5" />
    <circle cx="130" cy="-70" r="7" fill="#0c1e40" stroke="#ff8800" stroke-width="5" />

    <!-- Phone Body Outer Frame -->
    <rect x="-65" y="-120" width="130" height="230" rx="28" fill="#ffffff" stroke="url(#phoneBorder)" stroke-width="8" />
    <!-- Speaker / Sensor Notch -->
    <rect x="-18" y="-108" width="36" height="5" rx="2.5" fill="#003388" />
    <circle cx="25" cy="-105.5" r="2.5" fill="#003388" />

    <!-- 2x2 App Grid inside Phone -->
    <g transform="translate(0, -95)">
      <!-- 1. Display/Phone Icon (Blue) -->
      <rect x="-42" y="10" width="36" height="36" rx="9" fill="#0088ff" />
      <rect x="-33" y="17" width="18" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="-24" cy="35" r="1.5" fill="#ffffff" />

      <!-- 2. Settings/Gear (Orange) -->
      <rect x="6" y="10" width="36" height="36" rx="9" fill="#ff7700" />
      <path d="M 24 21 L 24 35 M 17 28 L 31 28 M 19 23 L 29 33 M 19 33 L 29 23" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <circle cx="24" cy="28" r="4.5" fill="#ff7700" stroke="#ffffff" stroke-width="2.5" />

      <!-- 3. Processor/Chip (Green) -->
      <rect x="-42" y="54" width="36" height="36" rx="9" fill="#00b060" />
      <rect x="-33" y="63" width="18" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <rect x="-27" y="69" width="6" height="6" fill="#ffffff" />
      <path d="M -30 60 L -30 63 M -24 60 L -24 63 M -18 60 L -18 63 M -30 81 L -30 84 M -24 81 L -24 84 M -18 81 L -18 84" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

      <!-- 4. Headset/Audio (Purple) -->
      <rect x="6" y="54" width="36" height="36" rx="9" fill="#7928ca" />
      <path d="M 16 75 A 8 8 0 0 1 32 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <rect x="14" y="73" width="3" height="7" rx="1.5" fill="#ffffff" />
      <rect x="31" y="73" width="3" height="7" rx="1.5" fill="#ffffff" />
    </g>

    <!-- Handshake Over Phone -->
    <g transform="translate(0, 42)">
      <!-- Blue Hand (Left) -->
      <path d="M -60 -10 C -40 -10 -25 5 -10 18 L 5 35 C -2 42 -12 40 -20 32 L -27 25 L -35 34 C -41 30 -43 24 -38 18 L -60 10 Z" fill="#0066ff" />
      <!-- Orange Hand (Right) -->
      <path d="M 60 -12 C 40 -12 25 5 10 16 L -6 2 C 5 -10 16 -12 30 -4 L 38 -12 C 43 -8 46 0 40 6 L 60 4 Z" fill="#ff7a00" />
      <!-- Clasp Fingers Detail -->
      <circle cx="-16" cy="27" r="4.5" fill="#ff8c00" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="-9" cy="33" r="4.5" fill="#ff7a00" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="-1" cy="38" r="4.5" fill="#ff6600" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Clean Top/Bottom Aesthetic Trim -->
  <rect x="0" y="0" width="800" height="4" fill="url(#blueTech)" />
  <rect x="0" y="396" width="800" height="4" fill="url(#orangeTech)" />
</svg>
