<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    
    <!-- Orange Accent Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" />
  
  <!-- Glowing Background Accents -->
  <circle cx="650" cy="150" r="250" fill="url(#glow)" />
  <circle cx="100" cy="350" r="200" fill="url(#glow)" />

  <!-- Left Side: Typography -->
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="1">DueSync</text>
  <text x="62" y="215" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#3B82F6">Sync your dues with DueSync!</text>
  
  <!-- Bullet Points -->
  <text x="62" y="265" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">🔒 100% Offline &amp; Private</text>
  <text x="62" y="295" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">🔔 Smart Payment Reminders</text>
  <text x="62" y="325" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">📊 Beautiful Financial Insights</text>

  <!-- Right Side: Floating Abstract Credit Cards -->
  <g transform="translate(480, 80)">
    <!-- Back Card (Shadow/Accent) -->
    <rect x="30" y="40" width="240" height="150" rx="16" fill="#334155" opacity="0.6" transform="rotate(-5 150 115)" />
    
    <!-- Front Card -->
    <rect x="0" y="0" width="240" height="150" rx="16" fill="url(#cardGrad)" transform="rotate(-15 120 75)" />
    
    <!-- Chip -->
    <rect x="30" y="30" width="35" height="25" rx="4" fill="#FFFFFF" opacity="0.8" transform="rotate(-15 120 75)" />
    
    <!-- Mock Text/Lines on Card -->
    <rect x="30" y="90" width="140" height="8" rx="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 120 75)" />
    <rect x="30" y="110" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 120 75)" />
    
    <!-- Contactless icon mock -->
    <circle cx="200" cy="42" r="12" fill="#FFFFFF" opacity="0.3" transform="rotate(-15 120 75)" />
  </g>
</svg>
